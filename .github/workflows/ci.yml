name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Parity sweep (port vs untouched v12)
        run: npm run parity -- --seeds 40 --days 70 --persona survivor --resume 11 --prefix ci

  windows:
    # The playable Windows build. Download it from this run's artifacts.
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - id: version
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # One file inside: the game itself, named TAP-OUT-<version> (Explorer hides the .exe).
      - uses: actions/upload-artifact@v4
        with:
          name: TAP-OUT-${{ steps.version.outputs.v }}-windows
          path: apps/desktop/release/TAP-OUT-*.exe
          if-no-files-found: error
          retention-days: 30
