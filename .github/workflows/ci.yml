name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Parity sweep (port vs untouched v12)
        run: npm run parity -- --seeds 40 --days 70 --persona survivor --resume 11 --prefix ci
      - name: Parity sweep with the usual ten (sleeping bag, snares, careful play)
        run: npm run parity -- --seeds 12 --days 70 --persona competent --resume 7 --prefix ci-kit --kit std

  windows:
    # The playable Windows build. Download it from this run's artifacts.
    runs-on: windows-latest
    needs: check
    outputs:
      version: ${{ steps.version.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - id: version
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # One file inside: the game itself, named TAP-OUT-<version> (Explorer hides the .exe).
      - uses: actions/upload-artifact@v4
        with:
          name: TAP-OUT-${{ steps.version.outputs.v }}-windows
          path: apps/desktop/release/TAP-OUT-*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    # A push to main (a merged pull request) puts that build on the release page for its version,
    # v<package.json version>, which, unlike artifacts, never expires. A version with a dash
    # (rc, beta) is a pre-release. Nothing here publishes to any store.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: windows
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TAP-OUT-${{ needs.windows.outputs.version }}-windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TAP / OUT ${{ needs.windows.outputs.version }}
          prerelease: ${{ contains(needs.windows.outputs.version, '-') }}
          files: release/TAP-OUT-*.exe
          body: |
            Download TAP-OUT-*.exe below, save it anywhere (the Desktop is fine) and double-click it.
            It is not code-signed, so Windows may say it protected your PC: click More info, then Run anyway.
            Your save lives in %APPDATA%\TAP OUT and is kept when you update.
