name: Release

# Pushing a tag like v1.0.0-rc.1 builds the Windows game and puts it on a GitHub release page.
# Unlike the per-push build artifacts, a release download never expires. A tag with a dash
# (rc, beta) is marked as a pre-release. Nothing here publishes to any store. The CI workflow has
# already checked the tagged commit on its way in.

on:
  push:
    tags: ['v*']
  # Or start it by hand from the Actions tab: it tags the current main as v<package.json version>.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: The tag matches the game's version
        id: tag
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "name=v$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; fi
      - run: npm run package:win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: TAP / OUT ${{ steps.tag.outputs.name }}
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: apps/desktop/release/TAP-OUT-*.exe
          body: |
            Download TAP-OUT-*.exe below, save it anywhere (the Desktop is fine) and double-click it.
            It is not code-signed, so Windows may say it protected your PC: click More info, then Run anyway.
            Your save lives in %APPDATA%\TAP OUT and is kept when you update.
